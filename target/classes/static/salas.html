<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/assets/img/logo.webp" type="image/x-icon" />
  <link rel="stylesheet" href="/assets/css/root.css" />
  <link rel="stylesheet" href="/assets/css/salas.css" />

  <title>CineTime</title>
</head>

<body>
  <header class="cine-header">
    <button class="header-icon" id="btn-header-action" title="Voltar / Início" aria-label="Ação de navegação">
      <a href="home.html" style="color: var(--font-color1)">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
      </a>
    </button>

    <div class="logo">
      <img src="assets/img/logo.webp" alt="Logo CineTime" />
      <span class="header-logo">Cine</span>
      <span class="roxo">Time</span>
    </div>
  </header>

  <main class="main" id="listaSalas"></main>

  <script>
    const API_URL = "https://cinetime-production-6087.up.railway.app";
    const listaSalas = document.getElementById("listaSalas");

    async function carregarSalas() {
      try {
        const response = await fetch(`${API_URL}/api/salas`);

        const salas = await response.json();

        listaSalas.innerHTML = "";

        if (salas.length === 0) {
          listaSalas.innerHTML = `
                  <p class="salas-empty">
                      Nenhuma sala criada.
                  </p>
              `;

          return;
        }

        salas.forEach((sala) => {
          listaSalas.innerHTML += `

              <div class="sala">

                  <div class="sala-thumb">

                      <svg xmlns="http://www.w3.org/2000/svg"
                          fill="none"
                          viewBox="0 0 24 24"
                          stroke="currentColor"
                          stroke-width="1.2">

                          <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z" />

                      </svg>

                  </div>

                  <div class="sala-info">

                      <p class="sala-name">
                          ${sala.nome}
                      </p>

                      <span class="sala-meta">
                          👥 Participantes:
                          ${sala.participantesAtual}/${sala.participantesMax}
                      </span>

                      <span class="sala-meta">
                          🌎 ${sala.idioma}
                      </span>

                      <span class="sala-meta">
                          ${sala.visivel ? "🔓 Pública" : "🔒 Privada"}
                      </span>

                      <button class="btn-entrar"
                          onclick="verificarEntrada(
                              ${sala.id},
                              ${sala.visivel}
                          )">

                          Entrar

                      </button>

                  </div>

              </div>

              `;
        });
      } catch (error) {
        console.error(error);

        listaSalas.innerHTML = `
              <p class="salas-empty">
                  Erro ao carregar salas.
              </p>
          `;
      }
    }

    async function entrarSala(id, senha) {
      try {
        const response = await fetch(`${API_URL}/api/salas/${id}/entrar`,
          {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              senha: senha,
            }),
          },
        );

        if (!response.ok) {
          const erro = await response.text();

          if (erro.includes("Senha incorreta")) {
            alert("Senha incorreta!");
            return;
          }

          if (erro.includes("Sala cheia")) {
            alert("Sala cheia!");
            return;
          }

          alert("Erro ao entrar na sala.");
          return;
        }

        window.location.href = `sala.html?id=${id}`;
      } catch (error) {
        console.error(error);
        alert("Erro ao entrar na sala.");
      }
    }

    function verificarEntrada(id, visivel) {
      if (visivel) {
        entrarSala(id, null);
        return;
      }

      const senhaDigitada = prompt("Digite a senha da sala:");

      if (senhaDigitada === null) return;

      entrarSala(id, senhaDigitada);
    }

    carregarSalas();

    // atualiza automaticamente
    setInterval(carregarSalas, 5000);
  </script>
</body>

</html>
