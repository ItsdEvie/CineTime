<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="assets/css/root.css">

  <title>Seu Perfil</title>

<body>
<aside class="sidebar">
  <a href="home.html" class="active">

<main class="main">
  <h1>Meu Perfil</h1>

  <div class="perfil-foto-bio">
    <div class="profile-card">
      <div class="avatar">
        <i class="bi bi-person-fill"></i>
      </div>
      <span class="username">
        </span>
    </div>

    </div>
  </div>

      <div class="movie-thumb matrix">
        <span class="thumb-text">MATRIX</span>
      </div>
      <span class="movie-name">Matrix</span>
    </div>
    <div class="movie-card">
      <div class="movie-thumb godfather">
        <div class="thumb-content">
          <i class="bi bi-person-fill"></i>
          <div class="gf-logo">
            <span>El</span>
            <span>Padrino</span>
          </div>
        </div>
      </div>
      <span class="movie-name">O Poderoso Chefão</span>
    </div>
    <div class="movie-card">
      <div class="movie-thumb inception">
        <span class="thumb-text">INCEPTION</span>
      </div>
      <span class="movie-name">Inception</span>
    </div>
  </div>

  <div class="section-title">Minha Lista</div>
  <div class="movie-grid">
    <div class="movie-card">
      <div class="movie-thumb matrix">
        <span class="thumb-text">MATRIX</span>
      </div>

    </div>
    <div class="movie-card">
      <div class="movie-thumb godfather">
        <div class="thumb-content">

          <div class="gf-logo">
            <span>El</span>
            <span>Padrino</span>
          </div>
        </div>
      </div>
      <span class="movie-name">O Poderoso Chefão</span>
    </div>
    <div class="movie-card">
      <div class="movie-thumb inception">
        <span class="thumb-text">INCEPTION</span>
      </div>
      <span class="movie-name">Inception</span>
    </div>
  </div>
