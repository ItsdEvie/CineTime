<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTime</title>

    <link rel="stylesheet" href="/assets/css/root.css">
    <link rel="stylesheet" href="/assets/css/sala.css">
    <link rel="shortcut icon" href="/assets/img/logo.webp" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="shell">
        <aside class="barra-lateral" id="barraLateral">
            <div class="sidebar-header">
                <h2>LISTA</h2>
                <div class="search-wrap">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="campoBusca" placeholder="Buscar filme...">
                </div>
            </div>

            <div class="lista-filmes" id="listaFilmes"></div>

        </aside>

        <div class="main">
            <header class="barra-topo">
                <div class="topbar-left">
                    <button class="icon-btn on" id="btnLista" title="Lista">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>

                    <a href="/home.html">
                        <button class="icon-btn" title="Início">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                <polyline points="9 22 9 12 15 12 15 22" />
                            </svg>
                        </button>
                    </a>
                </div>

                <div class="topbar-center">
                    <span class="brand">CINE</span>
                </div>

                <div class="topbar-right">
                    <button class="icon-btn" id="btnSalas" title="Salas">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                    </button>
                </div>
            </header>

            <div class="area-player">
                <div class="video-wrapper" id="containerVideo">
                    <div id="playerYoutube"></div>
                    <div id="camadaClique"></div>
                    <div class="empty-state" id="telaVazia">
                        <svg width="64" height="64" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                            <rect x="4" y="10" width="40" height="28" rx="4" />
                            <path d="M4 18h40M4 30h40M16 10v8M32 10v8M16 30v8M32 30v8" />
                        </svg>
                        <p>Selecione um vídeo para começar</p>
                    </div>
                </div>

                <div class="controles">
                    <div class="prog-row">
                        <div class="prog-track">
                            <div class="prog-fill" id="barraProgresso"></div>
                            <input type="range" id="barraTempo" min="0" max="1000" value="0" step="1">
                        </div>

                        <div class="time-txt" id="textoTempo">0:00 / 0:00</div>
                    </div>

                    <div class="ctrl-row">
                        <button class="ctrl-btn" id="btnVoltar" title="Voltar 10 segundos">
                            ⏪
                        </button>
                        <button class="ctrl-btn big" id="btnPlay" title="Play / Pause">

                            <svg id="iconePlay" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            <svg id="iconePause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                                <rect x="6" y="4" width="4" height="16" />
                                <rect x="14" y="4" width="4" height="16" />
                            </svg>
                        </button>
                        <button class="ctrl-btn" id="btnAvancar" title="Avançar 10 segundos">
                            ⏩
                        </button>
                        <div class="spacer"></div>
                        <div class="now-lbl" id="tituloAtual"></div>
                        <div class="spacer"></div>
                        <div class="vol-row">
                            <button class="ctrl-btn" id="btnVolume" title="Volume">
                                <svg id="iconeVolume" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                                </svg>

                                <svg id="iconeMute" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                                    <line x1="23" y1="9" x2="17" y2="15" />
                                    <line x1="17" y1="9" x2="23" y2="15" />
                                </svg>
                            </button>

                            <input type="range" id="barraVolume" min="0" max="100" value="80" step="1">
                        </div>

                        <button class="ctrl-btn" id="btnTelaCheia" title="Tela cheia">
                            ⛶
                        </button>
                    </div>
                </div>
                <p class="yt-note">▶ Clique em um vídeo da lista para assistir</p>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const filmes = [
            { id: 'i8Kx2eDnYLs', titulo: 'Superhero Movie', genero: 'Comédia' },
            { id: 'OsMhXertdTU', titulo: 'Arrebentando na Prisão', genero: 'Comédia' },
            { id: 'y5EcrFwj8yQ', titulo: 'Tropa de Elite', genero: 'Ação' },
            { id: 'Xs3ss61iyQs', titulo: 'João e Maria Caçadores de Bruxas', genero: 'Terror/Ação' }
        ];

        let player = null;
        let youtubePronto = false;
        let filmeAtual = null;
        let videoPendente = null;
        let volumeAtual = 80;
        let mutado = false;
        let intervalo = null;

        const barraLateral = document.getElementById('barraLateral');
        const btnLista = document.getElementById('btnLista');
        const btnSalas = document.getElementById('btnSalas');
        const listaFilmes = document.getElementById('listaFilmes');
        const campoBusca = document.getElementById('campoBusca');
        const telaVazia = document.getElementById('telaVazia');
        const barraProgresso = document.getElementById('barraProgresso');
        const barraTempo = document.getElementById('barraTempo');
        const textoTempo = document.getElementById('textoTempo');
        const iconePlay = document.getElementById('iconePlay');
        const iconePause = document.getElementById('iconePause');
        const iconeVolume = document.getElementById('iconeVolume');
        const iconeMute = document.getElementById('iconeMute');
        const barraVolume = document.getElementById('barraVolume');
        const tituloAtual = document.getElementById('tituloAtual');
        const containerVideo = document.getElementById('containerVideo');

        btnLista.addEventListener('click', () => {
            barraLateral.classList.toggle('hidden');
            btnLista.classList.toggle('on');
        });

        btnSalas.addEventListener('click', () => {
            barraLateral.classList.remove('hidden');
            btnLista.classList.add('on');
        });

        function renderizarLista(filtro = '') {
            listaFilmes.innerHTML = '';
            filmes
                .filter(filme => filme.titulo.toLowerCase().includes(filtro.toLowerCase()))
                .forEach(filme => {

                    const item = document.createElement('div');
                    item.className = 'item-filme';

                    if (filmeAtual && filmeAtual.id === filme.id)
                        item.classList.add('active');

                    item.innerHTML = `
                        <div class="thumb">
                            <img src="https://img.youtube.com/vi/${filme.id}/mqdefault.jpg" alt="${filme.titulo}">
                        </div>

                        <div class="info-filme">
                            <div class="titulo-filme">${filme.titulo}</div>
                            <div class="meta-filme">${filme.genero}</div>
                        </div>

                        ${filmeAtual && filmeAtual.id === filme.id ? '<div class="active-dot"></div>' : ''}
                    `;

                    item.addEventListener('click', () => carregarFilme(filme));
                    listaFilmes.appendChild(item);
                });
        }

        campoBusca.addEventListener('input', () => renderizarLista(campoBusca.value));

        function carregarFilme(filme) {
            filmeAtual = filme;
            telaVazia.style.display = 'none';
            tituloAtual.innerHTML = `<b>${filme.titulo}</b>`;
            renderizarLista(campoBusca.value);

            if (!youtubePronto) {
                videoPendente = filme.id;
                return;
            }
            if (!player)
                criarPlayer(filme.id);
            else
                player.loadVideoById(filme.id);
        }

        window.onYouTubeIframeAPIReady = function () {
            youtubePronto = true;

            if (videoPendente) {
                criarPlayer(videoPendente);
                videoPendente = null;
            }
        };

        function criarPlayer(videoId) {
            player = new YT.Player('playerYoutube', {

                videoId: videoId,

                width: '100%',
                height: '100%',

                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    rel: 0,
                    modestbranding: 1
                },

                events: {

                    onReady(evento) {
                        evento.target.setVolume(volumeAtual);
                        evento.target.playVideo();
                        iniciarIntervalo();
                    },

                    onStateChange(evento) {

                        if (evento.data === YT.PlayerState.PLAYING) {
                            atualizarPlay(true);
                            iniciarIntervalo();
                        } else {
                            atualizarPlay(false);
                            pararIntervalo();
                        }
                    }
                }
            });
        }

        function iniciarIntervalo() {
            pararIntervalo();

            intervalo = setInterval(() => {

                if (!player) return;

                const tempoAtual = player.getCurrentTime() || 0;
                const duracao = player.getDuration() || 0;

                if (duracao > 0) {

                    const porcentagem = (tempoAtual / duracao) * 100;
                    barraProgresso.style.width = porcentagem + '%';
                    barraTempo.value = Math.round((tempoAtual / duracao) * 1000);
                }
                textoTempo.textContent = formatarTempo(tempoAtual) + ' / ' + formatarTempo(duracao);
            }, 500);
        }

        function pararIntervalo() {
            clearInterval(intervalo);
        }

        function alternarPlay() {

            if (!player) return;

            if (player.getPlayerState() === YT.PlayerState.PLAYING)
                player.pauseVideo();
            else
                player.playVideo();
        }

        document.getElementById('btnPlay').addEventListener('click', alternarPlay);

        document.getElementById('camadaClique').addEventListener('click', alternarPlay);

        function atualizarPlay(tocando) {
            iconePlay.style.display = tocando ? 'none' : '';
            iconePause.style.display = tocando ? '' : 'none';
        }

        barraTempo.addEventListener('input', () => {

            if (!player) return;

            const duracao = player.getDuration() || 0;

            const novoTempo = (barraTempo.value / 1000) * duracao;

            player.seekTo(novoTempo, true);

            barraProgresso.style.width = (barraTempo.value / 10) + '%';
        });

        document.getElementById('btnVoltar').addEventListener('click', () => {

            if (!player) return;

            player.seekTo(
                Math.max(0, player.getCurrentTime() - 10),
                true
            );
        });

        document.getElementById('btnAvancar').addEventListener('click', () => {

            if (!player) return;

            player.seekTo(
                Math.min(player.getDuration(), player.getCurrentTime() + 10),
                true
            );
        });

        barraVolume.addEventListener('input', () => {

            volumeAtual = parseInt(barraVolume.value);

            if (volumeAtual === 0) {
                mutado = true;
                player.mute();
            } else {
                mutado = false;
                player.unMute();
                player.setVolume(volumeAtual);
            }
            atualizarVolume();
        });

        document.getElementById('btnVolume').addEventListener('click', () => {

            if (!player) return;
            mutado = !mutado;

            if (mutado)
                player.mute();
            else {
                player.unMute();
                player.setVolume(volumeAtual);
            }
            atualizarVolume();
        });

        function atualizarVolume() {
            iconeVolume.style.display = mutado ? 'none' : '';
            iconeMute.style.display = mutado ? '' : 'none';
        }

        document.getElementById('btnTelaCheia').addEventListener('click', () => {
            if (document.fullscreenElement)
                document.exitFullscreen();
            else
                containerVideo.requestFullscreen();
        });

        function formatarTempo(segundos) {
            if (!segundos || isNaN(segundos))
                return '0:00';

            const minutos = Math.floor(segundos / 60);
            const segundosRestantes = String(Math.floor(segundos % 60)).padStart(2, '0');
            return `${minutos}:${segundosRestantes}`;
        }
        renderizarLista();

    </script>

</body>

</html>
```
