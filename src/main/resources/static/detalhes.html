<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="assets/css/root.css" />
  <link rel="stylesheet" href="assets/css/home.css" />
  <link rel="stylesheet" href="assets/css/detalhes.css" />

  <link rel="shortcut icon" href="assets/img/logo.webp" type="image/x-icon" />

  <title>CineTime - Detalhes</title>
</head>

<body>
<header>
  <div
    class="logo"
    style="cursor: pointer"
    onclick="window.location.href = 'home.html'"
  >
    <img src="assets/img/logo.webp" alt="CineTime-logo" />
    <h1>Cine</h1>
    <h1 class="roxo">Time</h1>
  </div>

  <div
    class="avatar-header"
    id="avatar-menu"
    onclick="window.location.href = 'user.html'"
    title="Ir para o Perfil"
  >
    <svg xmlns="http://www.w3.org/2000/svg"
         width="20"
         height="20"
         fill="currentColor"
         class="bi bi-person-fill"
         viewBox="0 0 16 16">
      <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
    </svg>
  </div>
</header>

<main>
  <div
    style="
      color: #b3b3b3;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.2s;
    "
    onclick="window.history.back()"
    onmouseover="this.style.color = 'var(--primary-color)'"
    onmouseout="this.style.color = '#b3b3b3'"
  >
    ← Voltar
  </div>

  <div class="area-poster">
    <div class="poster-gigante" id="filme-poster"></div>
  </div>

  <div class="area-info">
    <h1 id="filme-titulo">Carregando...</h1>

    <div class="metadados">
      <span id="filme-ano">-</span>
      <span id="filme-duracao">-</span>
    </div>

    <div class="sinopse-titulo">Sinopse</div>

    <p class="sinopse-texto" id="filme-sinopse">
      Carregando detalhes do filme...
    </p>

    <div class="botoes-lista">
      <button class="btn-lista" onclick="salvarNasListas('QUERO_ASSISTIR')">
        🍿 Quero Assistir
      </button>

      <button class="btn-lista" onclick="salvarNasListas('ASSISTIDO')">
        ✅ Já Assistido
      </button>

      <button class="btn-lista btn-favorito" onclick="salvarNasListas('FAVORITO')">
        ❤️ Favorito
      </button>
    </div>
  </div>
</main>

<script>
  const API_URL = "https://cinetime-production-6087.up.railway.app";

  document.addEventListener("DOMContentLoaded", async () => {
    const userId = localStorage.getItem("userId");

    if (!userId) {
      window.location.href = "login.html";
      return;
    }

    await carregarAvatar(userId);
    await carregarDetalhesFilme();
  });

  async function carregarAvatar(userId) {
    try {
      const responseUsuario = await fetch(
        `${API_URL}/api/Usuarios/${userId}`
      );

      if (!responseUsuario.ok) {
        throw new Error("Erro ao carregar usuário");
      }

      const usuario = await responseUsuario.json();

      const elementoAvatar = document.getElementById("avatar-menu");

      if (!elementoAvatar) return;

      if (usuario.fotoPerfil && usuario.fotoPerfil.trim() !== "") {
        elementoAvatar.style.backgroundImage = `url('${usuario.fotoPerfil}')`;
        elementoAvatar.style.backgroundSize = "cover";
        elementoAvatar.style.backgroundPosition = "center";
        elementoAvatar.innerHTML = "";
      } else {
        elementoAvatar.style.backgroundImage = "none";

        elementoAvatar.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg"
               width="20"
               height="20"
               fill="currentColor"
               class="bi bi-person-fill"
               viewBox="0 0 16 16">
            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
          </svg>
        `;
      }

    } catch (erro) {
      console.error("Erro ao carregar avatar:", erro);
    }
  }

  async function carregarDetalhesFilme() {
    const parametrosUrl = new URLSearchParams(window.location.search);

    const id = parametrosUrl.get("id");
    const tipo = parametrosUrl.get("tipo");

    if (!id || !tipo) {
      document.getElementById("filme-sinopse").textContent =
        "Filme não encontrado.";
      return;
    }

    try {
      const response = await fetch(
        `${API_URL}/api/filmes/detalhes?id=${id}&tipo=${encodeURIComponent(tipo)}`
      );

      if (!response.ok) {
        throw new Error("Erro na API");
      }

      const filme = await response.json();

      console.log("O JAVA MANDOU ISSO AQUI ->", filme);

      const elementoTitulo = document.getElementById("filme-titulo");
      const elementoSinopse = document.getElementById("filme-sinopse");
      const elementoAno = document.getElementById("filme-ano");
      const elementoDuracao = document.getElementById("filme-duracao");
      const elementoPoster = document.getElementById("filme-poster");

      elementoTitulo.textContent = filme.titulo || "Título indisponível";

      elementoSinopse.textContent =
        filme.sinopse || "Nenhuma sinopse disponível em português para este título.";

      elementoSinopse.style.color = "#b3b3b3";

      elementoAno.textContent = filme.anoLancamento || "N/A";

      elementoDuracao.textContent =
        filme.duracao || "Duração indisponível";

      if (filme.imagemUrl) {
        elementoPoster.style.backgroundImage = `url('${filme.imagemUrl}')`;
      }

    } catch (err) {
      console.error("Erro ao renderizar a tela:", err);

      const elementoSinopse = document.getElementById("filme-sinopse");

      elementoSinopse.textContent = "Erro de conexão com o servidor.";
      elementoSinopse.style.color = "red";
    }
  }

  async function salvarNasListas(statusAcao) {
    const userId = localStorage.getItem("userId");

    if (!userId) {
      alert("Você precisa estar logado.");
      window.location.href = "login.html";
      return;
    }

    const parametrosUrl = new URLSearchParams(window.location.search);
    const idUrl = parametrosUrl.get("id");

    const titulo = document.getElementById("filme-titulo").textContent;
    const sinopse = document.getElementById("filme-sinopse").textContent;
    const ano = document.getElementById("filme-ano").textContent;
    const duracao = document.getElementById("filme-duracao").textContent;

    const elementoPoster = document.getElementById("filme-poster");

    let imagemUrl = elementoPoster.style.backgroundImage;

    imagemUrl = imagemUrl
      .replace('url("', '')
      .replace('")', '')
      .replace("url('", "")
      .replace("')", "");

    const filmeParaSalvar = {
      idExterno: idUrl ? parseInt(idUrl) : null,
      titulo: titulo,
      genero: parametrosUrl.get("tipo"),
      imagemUrl: imagemUrl,
      sinopse: sinopse,
      anoLancamento: ano,
      duracao: duracao,
      statusLista: statusAcao
    };

    try {
      const resposta = await fetch(
        `${API_URL}/api/filmes/salvar/${userId}`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(filmeParaSalvar),
        }
      );

      if (resposta.ok) {
        alert("Adicionado com sucesso!");
      } else {
        const erro = await resposta.text();

        if (erro.includes("Filme já está nessa lista")) {
          alert("Esse filme já está nessa lista.");
        } else {
          alert("Erro ao salvar nas suas listas.");
        }
      }

    } catch (erro) {
      console.error("Erro na requisição:", erro);
      alert("Erro de conexão com o servidor.");
    }
  }
</script>

</body>
</html>
