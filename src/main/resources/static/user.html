<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/assets/img/logo.webp" type="image/x-icon" />
  <link rel="stylesheet" href="/assets/css/root.css" />
  <link rel="stylesheet" href="/assets/css/user.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <title>Seu Perfil</title>
</head>

<body>
  <aside class="sidebar">
    <a href="/home" class="active">
      <i class="bi bi-house-fill"></i>
      Home
    </a>

    <a href="/userconfig.html">
      <i class="bi bi-gear-fill"></i>
      Configurações
    </a>

    <a href="/index.html" onclick="localStorage.clear()">
      <i class="bi bi-box-arrow-right"></i>
      Sair
    </a>
  </aside>

  <main class="main">
    <h1>Meu Perfil</h1>

    <div class="perfil-foto-bio">
      <div class="profile-card">
        <div class="avatar">
          <img id="foto-user" src="" alt="Foto usuário" style="
                width: 100%;
                height: 100%;
                border-radius: 50%;
                object-fit: cover;
                display: none;
              " />
          <i id="icone-user" class="bi bi-person-fill"></i>
        </div>

        <span class="username" id="username-user"></span>
      </div>

      <div class="bio-box">
        <div class="bio-label">Biografia</div>
        <p id="bio-user"></p>
      </div>
    </div>

    <div class="section-title">Últimos Filmes assistidos</div>
    <div class="movie-grid" id="lista-assistidos">
      <p style="color: #777">Carregando filmes...</p>
    </div>

    <div class="section-title">Favoritos</div>
    <div class="movie-grid" id="lista-favoritos">
      <p style="color: #999">Carregando favoritos...</p>
    </div>
  </main>

  <script>
    const API_URL = "https://cinetime-production-6087.up.railway.app";
    document.addEventListener("DOMContentLoaded", async () => {
      const userId = localStorage.getItem("userId");

      if (!userId) {
        window.location.href = "login.html";
        return;
      }

      await carregarUsuario(userId);
      await carregarAssistidos(userId);
      await carregarFavoritos(userId);
    });

    async function carregarUsuario(userId) {
      try {
        const response = await fetch(
          `${API_URL}/api/Usuarios/${userId}`,
        );

        if (!response.ok) {
          throw new Error("Erro ao carregar usuário");
        }

        const usuario = await response.json();

        document.getElementById("username-user").textContent =
          usuario.name || "";

        document.getElementById("bio-user").textContent =
          usuario.biografia || "Nenhuma biografia adicionada.";

        if (usuario.fotoPerfil) {
          const fotoUser = document.getElementById("foto-user");
          const iconeUser = document.getElementById("icone-user");

          fotoUser.src = usuario.fotoPerfil;
          fotoUser.style.display = "block";
          iconeUser.style.display = "none";
        }
      } catch (error) {
        console.error(error);
      }
    }

    async function carregarAssistidos(userId) {
      const container = document.getElementById("lista-assistidos");

      try {
        const response = await fetch(
          `${API_URL}/api/filmes/assistidos/${userId}`,
        );

        if (!response.ok) {
          throw new Error("Erro ao carregar assistidos");
        }

        const filmes = await response.json();

        if (filmes.length === 0) {
          container.innerHTML = `
            <p style="color:#777;">
              Nenhum filme assistido ainda.
            </p>
          `;
          return;
        }

        renderizarFilmes(container, filmes);
      } catch (erro) {
        console.error(erro);

        container.innerHTML = `
          <p style="color:red;">
            Erro ao carregar filmes assistidos.
          </p>
        `;
      }
    }

    async function carregarFavoritos(userId) {
      const container = document.getElementById("lista-favoritos");

      try {
        const response = await fetch(
          `${API_URL}/api/filmes/favoritos/${userId}`,
        );

        if (!response.ok) {
          throw new Error("Erro ao carregar favoritos");
        }

        const filmes = await response.json();

        if (filmes.length === 0) {
          container.innerHTML = `
            <p style="color:#777;">
              Você ainda não possui favoritos.
            </p>
          `;
          return;
        }

        renderizarFilmes(container, filmes);
      } catch (erro) {
        console.error(erro);

        container.innerHTML = `
          <p style="color:red;">
            Erro ao carregar favoritos.
          </p>
        `;
      }
    }

    function renderizarFilmes(container, filmes) {
      container.innerHTML = "";

      filmes.forEach((filme) => {
        const imagem =
          filme.imagemUrl && !filme.imagemUrl.includes("null")
            ? filme.imagemUrl
            : "assets/img/rolo-filme.png";

        container.innerHTML += `
          <div class="movie-card"
               onclick="window.location.href='detalhes.html?id=${filme.idExterno}&tipo=${encodeURIComponent(filme.genero)}'"
               style="cursor:pointer;">

            <div class="movie-thumb"
                 style="
                    background-image:url('${imagem}');
                    background-size:cover;
                    background-position:center;
                 ">
            </div>

            <span class="movie-name">
              ${filme.titulo}
            </span>
          </div>
        `;
      });
    }
  </script>
</body>

</html>
