<script>
  async function carregarUsuario() {
    const userId = localStorage.getItem("userId");

    if (!userId) {
      window.location.href = "login.html";
      return;
    }

    try {
      const response = await fetch(
        `http://localhost:8080/api/Usuarios/${userId}`,
      );

      if (!response.ok) {
        throw new Error("Erro ao carregar usuário");
      }

      const usuario = await response.json();

      // nome usuário
      document.getElementById("username-user").textContent = usuario.name;

      // foto perfil
      const foto = localStorage.getItem("fotoPerfil");

      if (foto) {
        const fotoUser = document.getElementById("foto-user");

        const iconeUser = document.getElementById("icone-user");

        fotoUser.src = foto;
        fotoUser.style.display = "block";

        iconeUser.style.display = "none";
      }
    } catch (error) {
      console.error(error);
    }

    const bio = localStorage.getItem("biografiaUsuario");

    if (bio) {
      document.getElementById("bio-user").textContent = bio;
    }
  }

  async function carregarListaFav() {
    //abstrair do try catch
    let data_fav;
    //pegar o elemento do html
    const listaFav = document.getElementById('list-fav');

    //consulta da api
    try {
      const response = await fetch(
        `http://localhost:8080/api/filmes/minha-lista`,
      );

      if (!response.ok) {
        throw new Error("Erro ao carregar usuário");
      }

      //aqui pega resposta da api e armazena os dados
      data_fav = await response.json();
    } catch (error) {
      console.error(error);
    }

    //aqui a gente faz um foreach para percorrer o array de dados
    //e usamos o inner html para adicionar o card formatado
    data_fav.forEach((filme) => {
      const cardMovieHtml = `
                  <div class="movie-card">
                    <div class="movie-thumb">
                      <img src="${filme.imagemUrl}" alt="">
                    </div>
                    <span class="movie-name">${filme.titulo}</span>
                  </div>
                `

      listaFav.innerHTML=cardMovieHtml;
    })
  }

  carregarUsuario();
  carregarListaFav();
</script>
