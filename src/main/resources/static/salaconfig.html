<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/assets/css/root.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/salaconfig.css">
    <link rel="shortcut icon" href="/assets/img/logo.webp" type="image/x-icon">

    <title>CineTime</title>
</head>

<body>

<header class="cine-header">
    <button class="header-icon" id="btn-header-action" title="Voltar / Início" aria-label="Ação de navegação">
        <a href="/home" style="color: var(--font-color1);">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
        </a>
    </button>

    <div class="logo">
        <img src="/assets/img/logo.webp" alt="Logo CineTime">
        <span class="header-logo">Cine</span>
        <span class="roxo">Time</span>
    </div>
</header>

<main id="page-configurar" class="page active">
    <h1 class="configurar-title">Configurar</h1>

    <form class="configurar-form" id="form-criar-sala" autocomplete="off">

        <div class="form-group">
            <label for="nome-sala">Nome da Sala:</label>
            <input type="text" id="nome-sala" placeholder="Digite o nome da sala" maxlength="40" />
        </div>

        <div class="form-group">
            <label for="idioma-sala">Idioma da Sala</label>
            <div class="select-wrapper">
                <select id="idioma-sala">
                    <option value="pt-BR">Português</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </div>

        <div class="form-group toggle-row">
            <label for="sala-visivel">Sala Privada</label>
            <label class="toggle-switch">
                <input type="checkbox" id="sala-visivel" />
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="form-group senha-group" id="senha-group">
            <label for="senha-sala">Senha da Sala:</label>
            <input type="password" id="senha-sala" placeholder="Insira uma senha" maxlength="32" />
        </div>

        <div class="form-group">
            <label for="participantes">Participantes</label>
            <div class="select-wrapper">
                <select id="participantes">
                    <option value="" disabled selected>Quantidade de Participantes</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn-criar">Criar Sala</button>
    </form>
</main>

<div class="toast" id="toast"></div>

<script>
    const form = document.getElementById('form-criar-sala');
    const togglePrivada = document.getElementById('sala-visivel');
    const senhaGroup = document.getElementById('senha-group');
    const toast = document.getElementById('toast');

    function showToast(msg, duration = 2800) {
        toast.textContent = msg;
        toast.classList.add('show');

        setTimeout(() => {
            toast.classList.remove('show');
        }, duration);
    }

    togglePrivada.addEventListener('change', () => {
        const privada = togglePrivada.checked;

        if (privada) {
            senhaGroup.classList.add('visible');
        } else {
            senhaGroup.classList.remove('visible');
            document.getElementById('senha-sala').value = '';
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nome = document.getElementById('nome-sala').value.trim();
        const idioma = document.getElementById('idioma-sala').value;

        const privada = togglePrivada.checked;
        const visivel = !privada;

        const senha = document.getElementById('senha-sala').value;
        const participantes = document.getElementById('participantes').value;

        if (!nome) {
            showToast('⚠️ Digite o nome da sala.');
            document.getElementById('nome-sala').focus();
            return;
        }

        if (!participantes) {
            showToast('⚠️ Selecione a quantidade de participantes.');
            return;
        }

        if (privada && !senha) {
            showToast('⚠️ Insira uma senha para a sala privada.');
            document.getElementById('senha-sala').focus();
            return;
        }

        const salaDTO = {
            nome: nome,
            idioma: idioma,
            visivel: visivel,
            senha: privada ? senha : null,
            participantesMax: parseInt(participantes),
            donoId: localStorage.getItem("userId") || 1
        };

        try {
            const response = await fetch("http://localhost:8080/api/salas", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(salaDTO)
            });

            if (!response.ok) {
                const erro = await response.text();
                console.error(erro);
                throw new Error("Erro ao criar sala");
            }

            const salaCriada = await response.json();

            showToast(`✅ Sala "${nome}" criada com sucesso!`);

            form.reset();
            senhaGroup.classList.remove('visible');

            setTimeout(() => {
                window.location.href = `/sala/${salaCriada.id}`;
            }, 800);

        } catch (error) {
            console.error(error);
            showToast("❌ Erro ao criar sala.");
        }
    });
</script>

</body>
</html>
