<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/src/main/resources/static/assets/img/logo.webp"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="/src/main/resources/static/assets/css/root.css"
    />
    <link
      rel="stylesheet"
      href="/src/main/resources/static/assets/css/user.css"
    />

    <title>Seu Perfil</title>
  </head>
  <body>
    <aside class="sidebar">
      <a href="/src/main/resources/templates/home.html" class="active">
        <i class="bi bi-house-fill"></i>
        Home
      </a>
      <a href="/src/main/resources/templates/userconfig.html">
        <i class="bi bi-gear-fill"></i>
        Configurações
      </a>
      <a href="/src/main/resources/templates/home.html">
        <i class="bi bi-box-arrow-right"></i>
        Sair
      </a>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <h1>Meu Perfil</h1>

      <!-- Profile -->
      <div class="profile-card">
        <div class="avatar">
          <img
            id="foto-user"
            src=""
            alt="Foto usuário"
            style="
              width: 100%;
              height: 100%;
              border-radius: 50%;
              object-fit: cover;
              display: none;
            "
          />
          <i id="icone-user" class="bi bi-person-fill"></i>
        </div>
        <span class="username" id="username-user"></span>
      </div>

      <!-- Biography -->
      <div class="bio-box">
        <div class="bio-label">Biografia</div>

        <p id="bio-user"></p>
      </div>

      <!-- Últimos filmes assistidos -->
      <div class="section-title">Ultimos Filmes assistidos</div>
      <div class="movie-grid">
        <div class="movie-card">
          <div class="movie-thumb matrix">
            <span class="thumb-text">MATRIX</span>
          </div>
          <span class="movie-name">Matrix</span>
        </div>
        <div class="movie-card">
          <div class="movie-thumb godfather">
            <div class="thumb-content">
              <i class="bi bi-person-fill"></i>
              <div class="gf-logo">
                <span>El</span>
                <span>Padrino</span>
              </div>
            </div>
          </div>
          <span class="movie-name">O Poderoso Chefão</span>
        </div>
        <div class="movie-card">
          <div class="movie-thumb inception">
            <span class="thumb-text">INCEPTION</span>
          </div>
          <span class="movie-name">Inception</span>
        </div>
      </div>

      <!-- Minha Lista -->
      <div class="section-title">Minha Lista</div>
      <div class="movie-grid">
        <div class="movie-card">
          <div class="movie-thumb matrix">
            <span class="thumb-text">MATRIX</span>
          </div>
          <span class="movie-name">Matrix</span>
        </div>
        <div class="movie-card">
          <div class="movie-thumb godfather">
            <div class="thumb-content">
              <i class="bi bi-person-fill"></i>
              <div class="gf-logo">
                <span>El</span>
                <span>Padrino</span>
              </div>
            </div>
          </div>
          <span class="movie-name">O Poderoso Chefão</span>
        </div>
        <div class="movie-card">
          <div class="movie-thumb inception">
            <span class="thumb-text">INCEPTION</span>
          </div>
          <span class="movie-name">Inception</span>
        </div>
      </div>
    </main>
    <script>
      async function carregarUsuario() {
        const userId = localStorage.getItem("userId");

        if (!userId) {
          window.location.href = "login.html";
          return;
        }

        try {
          const response = await fetch(
            `http://localhost:8080/api/Usuarios/${userId}`,
          );

          if (!response.ok) {
            throw new Error("Erro ao carregar usuário");
          }

          const usuario = await response.json();

          // nome usuário
          document.getElementById("username-user").textContent = usuario.name;

          // foto perfil
          const foto = localStorage.getItem("fotoPerfil");

          if (foto) {
            const fotoUser = document.getElementById("foto-user");

            const iconeUser = document.getElementById("icone-user");

            fotoUser.src = foto;
            fotoUser.style.display = "block";

            iconeUser.style.display = "none";
          }
        } catch (error) {
          console.error(error);
        }

        const bio = localStorage.getItem("biografiaUsuario");

        if (bio) {
          document.getElementById("bio-user").textContent = bio;
        }
      }

      carregarUsuario();
    </script>
  </body>
</html>
