<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/src/main/resources/static/assets/img/logo.webp" type="image/x-icon">
    <link rel="stylesheet" href="/src/main/resources/static/assets/css/root.css">
    <link rel="stylesheet" href="/src/main/resources/static/assets/css/cadastro.css">

    <title>Faça seu cadastro na CineTime</title>
</head>

<body>
    <a href="index.html">
        <svg style="color: var(--font-color1);" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-left"
            viewBox="0 0 14 14">
            <path fill-rule="evenodd"
                d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
    </svg>
    </a>
    <main>
        <section>
            <div class="container-lado-esquerdo-login">
                <div class="logo">
                    <img src="/src/main/resources/static/assets/img/logo.webp" alt="logo">
                    <h1>Cine</h1>
                    <h1 class="roxo">Time</h1>
                </div>
                <h2>Bem-Vindo(a). <br> Sua sala de cinema, <br> em qualquer lugar.</h2>
            </div>

            <form action="">
                <h1>CADASTRO</h1>
                <div class="input">
                    <label for="">Nome:</label>
                    <input type="text" required id="nome" name="nome" placeholder="Digite seu nome:">
                </div>
                <div class="input">
                    <label for="">Data de nascimento:</label>
                    <input type="date" required id="date" name="date" placeholder="dd/mm/yyyy">
                </div>
                <div class="input">
                    <label for="">Email:</label>
                    <input type="email" required id="email" name="email" placeholder="Digite seu email:">
                </div>
                <div class="input">
                    <label for="">Crie uma senha:</label>
                    <input type="password" required id="senha" name="senha" placeholder="Insira uma senha:">
                </div>
                <div class="input">
                    <label for="">Confirmar senha:</label>
                    <input type="password" required id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha:">
                </div>
                <input id="submit" type="submit">
            </form>
        </section>
    </main>
</body>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.querySelector("form");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const nome = document.getElementById("nome").value;
            const date = document.getElementById("date").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmar-senha").value;

            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem!");
                return;
            }

            const dados = {
                name: document.getElementById("nome").value,
                date: document.getElementById("date").value,
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value,
                confirmarSenha: document.getElementById("confirmar-senha").value
            };


            try {
                const response = await fetch("http://localhost:8080/api/Usuarios/cadastro", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert("Cadastro realizado com sucesso!");
                    console.log(result);
                    window.location.href = "login.html";
                } else {
                    alert("Erro ao realizar cadastro.");
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Não foi possível conectar ao servidor.");
            }
        });
    });
</script>


</html>
